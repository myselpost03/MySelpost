    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-9B4XGR3X7Z");

    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="d1f76f7c-aa17-429e-ba89-519eb6080819"
    ></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker
            .register("./service-worker.js", { scope: "/" })
            .then(function (registration) {
              console.log("Service Worker Registered!");
            })
            .catch(function (error) {
              console.log("Service Worker Registration Failed:", error);
            });
        });
      }

      window.addEventListener("DOMContentLoaded", () => {
        window.addEventListener("beforeinstallprompt", (event) => {
          event.preventDefault();
          console.log("👍 beforeinstallprompt fired");
          window.deferredPrompt = event;
          document.getElementById("install-popup").style.display = "block";
        });
      });

      window.addEventListener("appinstalled", function (event) {
        console.log("App installed successfully");
        document.getElementById("install-popup").style.display = "none";
      });

      function installApp() {
        const installPopup = document.getElementById("install-popup");
        installPopup.style.display = "none";
        if (window.deferredPrompt) {
          window.deferredPrompt.prompt();
          window.deferredPrompt.userChoice.then(function (choiceResult) {
            if (choiceResult.outcome === "accepted") {
              console.log("User accepted the install prompt");
            } else {
              console.log("User dismissed the install prompt");
            }
            window.deferredPrompt = null;
          });
        }
      }

      function cancelInstall() {
        const installPopup = document.getElementById("install-popup");
        installPopup.style.display = "none";
        window.deferredPrompt = null;
      }
    </script>

    <!-- PayPal SDK -->
    <script src="https://www.paypal.com/sdk/js?client-id=AVgtohR20go8ZTiaW4UnDMKUg44T7fgrGoa8emnIgN71wamVtcfaYLKodXfo_puCWu4yL58cFd_or-LA&currency=USD"></script>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="install-popup">
      <div id="install-popup-content">
        <button id="install-button" onclick="trackInstallClick(); installApp()">
          Install
        </button>
        <button
          id="cancel-button"
          onclick="trackCancelClick(); cancelInstall()"
        >
          Cancel
        </button>
      </div>
    </div>
    <script>
      // Track Install button click event
      function trackInstallClick() {
        gtag("event", "click", {
          event_category: "Install Popup",
          event_label: "Install Button",
          value: 1,
        });
      }

      // Track Cancel button click event
      function trackCancelClick() {
        gtag("event", "click", {
          event_category: "Install Popup",
          event_label: "Cancel Button",
          value: 1,
        });
      }
    </script>
    <script src="./service-worker.js" defer></script>
  </body>
