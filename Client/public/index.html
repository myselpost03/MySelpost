    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            // 1️⃣ Register your custom service worker
            const customSW = await navigator.serviceWorker.register(
              './service-worker.js',
              {
                scope: '/',
              }
            );
            //console.log("✅ Custom Service Worker Registered:", customSW);

            // 2️⃣ Register OneSignal service worker
            const oneSignalSW = await navigator.serviceWorker.register(
              './OneSignalSDKWorker.js',
              {
                scope: '/',
              }
            );
            //console.log("✅ OneSignal Service Worker Registered:", oneSignalSW);
          } catch (error) {
            console.error('❌ Service Worker Registration Failed:', error);
          }
        });
      }

      window.addEventListener('DOMContentLoaded', () => {
        window.addEventListener('beforeinstallprompt', (event) => {
          event.preventDefault();
          // console.log("👍 beforeinstallprompt fired");
          window.deferredPrompt = event;
          document.getElementById('install-popup').style.display = 'block';
        });
      });

      window.addEventListener('appinstalled', function (event) {
        console.log('App installed successfully');
        document.getElementById('install-popup').style.display = 'none';
      });

      function installApp() {
        const installPopup = document.getElementById('install-popup');
        installPopup.style.display = 'none';
        if (window.deferredPrompt) {
          window.deferredPrompt.prompt();
          window.deferredPrompt.userChoice.then(function (choiceResult) {
            if (choiceResult.outcome === 'accepted') {
              console.log('User accepted the install prompt');
            } else {
              console.log('User dismissed the install prompt');
            }
            window.deferredPrompt = null;
          });
        }
      }

      function cancelInstall() {
        const installPopup = document.getElementById('install-popup');
        installPopup.style.display = 'none';
        window.deferredPrompt = null;
      }
    </script>
